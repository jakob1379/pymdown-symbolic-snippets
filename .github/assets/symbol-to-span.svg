<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="t d">
<title id="t">pymdown-symbolic-snippets resolving a symbol to lines</title>
<desc id="d">A snippet reference to SymbolResolver.resolve is found in the module's syntax tree, rewritten to the line span 90:90,98:141 for pymdownx.snippets, and rendered as code. When six lines are added above the class, the span becomes 96:96,104:147 and the rendered snippet is unchanged.</desc>
